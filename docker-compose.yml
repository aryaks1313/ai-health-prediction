services:

  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: health_prediction_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_prediction_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/health_prediction_db"

      GROQ_API_KEY: ${GROQ_API_KEY}

      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}

      AI_MODE: ${AI_MODE:-live}

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: